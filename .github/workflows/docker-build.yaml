name: Build docker Images

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:

  build_images:
    strategy:
      matrix:
        include:
          - { image: ubuntu,         platform: x86_64,  runner: ubuntu-latest }
          - { image: manylinux2014,  platform: x86_64,  runner: ubuntu-latest }
          - { image: manylinux_2_28, platform: x86_64,  runner: ubuntu-latest }
          - { image: manylinux_2_28, platform: aarch64, runner: ubuntu-24.04-arm }
      fail-fast: false

    name: Push ${{ matrix.image }} (${{ matrix.platform }}) image
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"    
      - name: Check username
        run: |
          echo ${{ vars.BOOGERT_DOCKER_USERNAME }}

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          Username: ${{ vars.BOOGERT_DOCKER_USERNAME }}
          password: ${{ secrets.BOOGERT_DOCKER_PASSWORD }}

      - name: Derive image name
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
            if [[ "$IMAGE" =~ ^manylinux.* ]]; then
              echo "IMAGE_NAME=${IMAGE}_${PLATFORM}" >> $GITHUB_ENV
            else
              echo "IMAGE_NAME=${IMAGE}" >> $GITHUB_ENV
            fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: g4edge/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./${{ matrix.image }}/
          file: ./${{ startsWith(matrix.image, 'manylinux') && 'manylinux_common' || matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE=${{ matrix.image }}
            ARCH=${{ matrix.platform }}
